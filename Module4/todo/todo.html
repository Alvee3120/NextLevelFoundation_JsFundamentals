<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo List</title>
    <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: 500px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #222;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }

  #taskInput {
    flex: 1;
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
  }

  #taskInput:focus {
    border-color: #4f46e5;
  }

  #addBtn {
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }

  #addBtn:hover {
    background: #3730a3;
  }

  #taskList {
    list-style: none;
  }

  /* Task item */
  .task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    background: #f8f9fa;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    border-left: 4px solid #4f46e5;
  }

  /* Task text */
  .task-text {
    flex: 1;
    font-size: 16px;
    color: #333;
  }

  /* Button wrapper */
  .task-button {
    display: flex;
    gap: 8px;
  }

  /* Buttons */
  .task-button button {
    border: none;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    color: white;
    transition: 0.2s;
  }

  /* Complete */
  .task-button button:first-child {
    background: #22c55e;
  }

  .task-button button:first-child:hover {
    background: #16a34a;
  }

  /* Delete */
  .task-button button:last-child {
    background: #ef4444;
  }

  .task-button button:last-child:hover {
    background: #dc2626;
  }
</style>
  </head>
  <body>
    <div class="app">
      <h1>My Todo App</h1>
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Enter a task..." />
        <button id="addBtn">Add</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <script src="todo.js"></script>
  </body>
</html>
